{% extends "layout.html" %}
{% load static %}

{% block head %}
<style>
    .messages-container {
        height: calc(100vh - 150px);
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        overflow: hidden;
        border: 1px solid #eaeaea;
        margin-top: 10px;
    }
    
    .inbox-panel {
        background: #fcfcfc;
        border-right: 1px solid #eaeaea;
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    
    .chat-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: #ffffff;
    }
    
    .panel-header {
        padding: 20px;
        background: #fff;
        border-bottom: 1px solid #eaeaea;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .inbox-item {
        transition: 0.2s all;
        cursor: pointer;
        border-bottom: 1px solid #f1f1f1;
    }
    .inbox-item:hover {
        background: #f1f3f5;
    }
    .inbox-item.active {
        background: #e9ecef;
        border-left: 4px solid #0d6efd;
    }
    
    .avatar-placeholder-circle { 
        background: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #495057; overflow: hidden; 
    }
    
    .status-dot-modern {
        position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; background: #adb5bd; border: 2px solid white; border-radius: 50%;
    }
    .status-online { background: #198754 !important; }

    .chat-scroll-area {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
        background: #fafafa;
    }

    .msg-bubble-modern {
        padding: 12px 18px;
        font-size: 0.95rem;
        max-width: 75%;
        border-radius: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        line-height: 1.5;
        position: relative;
        margin-bottom: 12px;
    }
    .msg-sent-modern {
        background: #0d6efd;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }
    .msg-received-modern {
        background: #ffffff;
        color: #212529;
        border: 1px solid #eaeaea;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    .msg-time-modern { font-size: 0.65rem; margin-top: 6px; opacity: 0.8; text-align: right; }

    .chat-footer {
        padding: 15px 20px;
        background: #fff;
        border-top: 1px solid #eaeaea;
    }
    
    .modern-input-group {
        background: #f1f3f5;
        border-radius: 30px;
        padding: 5px 15px;
        display: flex;
        align-items: center;
    }
    .modern-input-group input {
        border: none;
        background: transparent;
        padding: 10px;
        flex-grow: 1;
        outline: none;
    }
    .modern-send-btn {
        background: #0d6efd;
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }
    .modern-send-btn:hover {
        background: #0b5ed7;
    }
    
    .chat-empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #adb5bd;
    }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 10px; }
</style>
{% endblock head %}

{% block body %}
<div class="container-fluid">
    <div class="row messages-container g-0">
        <!-- Inbox Sidebar -->
        <div class="col-md-4 col-lg-3 inbox-panel">
            <div class="panel-header shadow-sm">
                <h5 class="m-0 fw-bold"><i class="fas fa-comment-dots text-primary me-2"></i>Mesajlar</h5>
            </div>
            <div class="chat-scroll-area p-0" id="inbox-list">
                <div class="text-center p-5 opacity-50">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="col-md-8 col-lg-9 chat-panel">
            <!-- Header (Hidden when no chat active) -->
            <div class="panel-header shadow-sm z-1" id="chat-header" style="display: none;">
                <div class="d-flex align-items-center gap-3">
                    <div class="position-relative">
                        <div class="avatar-placeholder-circle" style="width: 48px; height: 48px;">
                            <img id="chat-user-avatar" src="" class="rounded-circle" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                            <span id="chat-user-initials"></span>
                        </div>
                        <span id="chat-user-status-dot" class="status-dot-modern"></span>
                    </div>
                    <div>
                        <h6 class="m-0 fw-bold" id="chat-target-name">Kullanıcı</h6>
                        <small id="chat-target-status" class="text-muted">Son görülme: ...</small>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="chat-empty-state" class="chat-empty-state">
                <i class="far fa-comments fa-4x mb-3 opacity-50"></i>
                <h5>Sohbet başlatmak için bir kişi seçin</h5>
                <p class="small">Sol taraftaki listeden bir konuşmaya tıklayın.</p>
            </div>

            <!-- Messages Area -->
            <div class="chat-scroll-area d-flex flex-column" id="chat-messages" style="display: none !important;">
            </div>

            <!-- Footer / Input form -->
            <div class="chat-footer z-1" id="chat-footer" style="display: none;">
                <form id="chat-form">
                    <input type="hidden" id="chat-receiver-id">
                    <div class="modern-input-group">
                        <input type="text" id="chat-input" name="body" autocomplete="off" placeholder="Mesajınızı buraya yazın..." required>
                        <button type="submit" class="modern-send-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock body %}

{% block js %}
<script>
$(document).ready(function() {
    let activeUserId = null;
    let chatInterval = null;
    const currentUserId = "{{ request.user.id }}";
    
    function getInitials(name) {
        if (!name) return "??";
        let parts = name.trim().split(" ");
        let initials = parts[0].charAt(0);
        if (parts.length > 1) initials += parts[parts.length - 1].charAt(0);
        return initials.toUpperCase();
    }

    // Load Inbox list
    function loadInbox() {
        $.ajax({
            url: "{% url 'user:inbox' %}",
            headers: { "X-Requested-With": "XMLHttpRequest" },
            success: function(data) {
                let html = "";
                if (data.conversations && data.conversations.length > 0) {
                    data.conversations.forEach(function(c) {
                        let badge = c.unread > 0 ? `<span class="badge bg-primary rounded-pill">${c.unread}</span>` : "";
                        let isActive = activeUserId == c.user_id ? "active" : "";
                        let showAvatar = (c.avatar && c.avatar.indexOf("default") === -1) ? true : false;
                        
                        html += `
                        <div class="inbox-item p-3 d-flex align-items-center gap-3 ${isActive}" data-user-id="${c.user_id}" data-username="${c.username}">
                            <div class="position-relative">
                                <div class="avatar-placeholder-circle shadow-sm" style="width: 45px; height: 45px;">
                                    ${showAvatar ? `<img src="${c.avatar}" class="rounded-circle" style="width: 100%; height: 100%; object-fit: cover;">` : `<span class="initials-text">${getInitials(c.username)}</span>`}
                                </div>
                                ${c.is_online ? '<span class="status-dot-modern status-online"></span>' : ''}
                            </div>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="fw-bold text-dark">${c.username}</span>
                                    <span class="text-muted" style="font-size: 0.7rem;">${c.time}</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="text-truncate text-muted" style="font-size: 0.8rem; max-width: 80%;">${c.last_msg}</span>
                                    ${badge}
                                </div>
                            </div>
                        </div>`;
                    });
                } else {
                    html = '<div class="text-center p-5 text-muted small mt-4">Henüz mesajınız yok.</div>';
                }
                $("#inbox-list").html(html);
            }
        });
    }

    // Load chat detail
    function loadChatHistory(userId, scrollToBottom = false) {
        if (!userId) return;
        $.ajax({
            url: "/user/chat/" + userId + "/",
            type: "GET",
            headers: { "X-Requested-With": "XMLHttpRequest" },
            success: function(data) {
                let msgHtml = "";
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(function(m) {
                        let alignmentClass = m.is_me ? "msg-sent-modern" : "msg-received-modern";
                        msgHtml += `
                        <div class="msg-bubble-modern ${alignmentClass}">
                            <div style="word-break: break-word;">${m.body}</div>
                            <div class="msg-time-modern">${m.time} ${m.is_me && m.is_read ? '<i class="fas fa-check-double ms-1 text-white-50"></i>' : (m.is_me ? '<i class="fas fa-check ms-1 text-white-50"></i>' : '')}</div>
                        </div>`;
                    });
                } else {
                    msgHtml = `<div class="text-center p-4 text-muted small mt-auto mb-auto">İlk mesajı siz gönderin...</div>`;
                }
                
                $("#chat-messages").html(msgHtml);
                
                if (data.other_user) {
                    $("#chat-target-name").text(data.other_user.username);
                    let hasAvatar = data.other_user.avatar && data.other_user.avatar.indexOf("default") === -1;
                    if(hasAvatar) {
                        $("#chat-user-avatar").attr("src", data.other_user.avatar).show();
                        $("#chat-user-initials").hide();
                    } else {
                        $("#chat-user-avatar").hide();
                        $("#chat-user-initials").text(getInitials(data.other_user.username)).show();
                    }
                    
                    if (data.other_user.is_online) {
                        $("#chat-user-status-dot").addClass("status-online");
                        $("#chat-target-status").text("Çevrimiçi").removeClass("text-muted").addClass("text-success");
                    } else {
                        $("#chat-user-status-dot").removeClass("status-online");
                        $("#chat-target-status").text("Son görülme: " + data.other_user.last_seen).removeClass("text-success").addClass("text-muted");
                    }
                }
                
                if (scrollToBottom) {
                    let chatArea = $("#chat-messages");
                    if (chatArea.length) chatArea.scrollTop(chatArea[0].scrollHeight);
                }
            }
        });
    }

    // Handle inbox item click
    $(document).on("click", ".inbox-item", function() {
        $(".inbox-item").removeClass("active");
        $(this).addClass("active");
        
        let userId = $(this).attr("data-user-id");
        if (userId === currentUserId) return;
        
        activeUserId = userId;
        $("#chat-receiver-id").val(userId);
        
        $("#chat-empty-state").hide();
        $("#chat-header").attr("style", "display: flex !important;");
        $("#chat-messages").attr("style", "display: flex !important;");
        $("#chat-footer").show();
        
        loadChatHistory(userId, true);
        
        // Start polling for this specific chat
        if (chatInterval) clearInterval(chatInterval);
        chatInterval = setInterval(function() {
            loadChatHistory(activeUserId, false);
            loadInbox();
        }, 5000); // Poll every 5 seconds to reduce terminal spam
    });

    // Handle message send
    $("#chat-form").on("submit", function(e) {
        e.preventDefault();
        let userId = $("#chat-receiver-id").val();
        let messageInput = $("#chat-input");
        let messageText = messageInput.val().trim();
        
        if (!messageText || !userId) return;
        
        $.ajax({
            url: "/user/chat/" + userId + "/",
            type: "POST",
            data: { "body": messageText, "csrfmiddlewaretoken": "{{ csrf_token }}" },
            headers: { "X-Requested-With": "XMLHttpRequest" },
            success: function() {
                messageInput.val("");
                loadChatHistory(userId, true);
                loadInbox();
            }
        });
    });

    // Initialize
    loadInbox();
    
    // URL Param check (to open specific chat)
    const urlParams = new URLSearchParams(window.location.search);
    const targetUserId = urlParams.get('user_id');
    if (targetUserId && targetUserId !== currentUserId) {
        activeUserId = targetUserId;
        $("#chat-receiver-id").val(targetUserId);
        $("#chat-empty-state").hide();
        $("#chat-header").attr("style", "display: flex !important;");
        $("#chat-messages").attr("style", "display: flex !important;");
        $("#chat-footer").show();
        loadChatHistory(targetUserId, true);
        
        chatInterval = setInterval(function() {
            loadChatHistory(activeUserId, false);
            loadInbox();
        }, 5000);
    }

    // Poll inbox if no active chat
    setInterval(function() {
        if (!activeUserId) loadInbox();
    }, 10000); 
});
</script>
{% endblock js %}
