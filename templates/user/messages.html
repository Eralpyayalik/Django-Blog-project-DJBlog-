{% extends "layout.html" %}
{% load static %}

{% block head %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap');

    body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        /* Sleek luxury mesh background */
        background-image: 
            radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
    }

    h1, h2, h3, h4, h5, h6 {
        font-family: 'Outfit', sans-serif;
    }

    .messages-container {
        height: calc(100vh - 120px);
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.04);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.8);
        margin-top: 10px;
    }
    
    .inbox-panel {
        background: rgba(248, 250, 252, 0.45);
        border-right: 1px solid rgba(226, 232, 240, 0.6);
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    
    .chat-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: transparent;
    }
    
    .panel-header {
        padding: 16px 24px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 75px;
    }

    .inbox-item {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border-bottom: 1px solid rgba(226, 232, 240, 0.4);
        padding: 16px !important;
        margin: 6px 12px;
        border-radius: 14px;
    }
    .inbox-item:hover {
        background: rgba(255, 255, 255, 0.7);
        transform: translateY(-1px);
    }
    .inbox-item.active {
        background: #ffffff;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.05);
        border-left: 4px solid #3b82f6;
    }
    
    .avatar-placeholder-circle { 
        background: #e2e8f0; 
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-weight: 600; 
        color: #475569; 
        overflow: hidden; 
        border: 2px solid #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    
    .status-dot-modern {
        position: absolute; 
        bottom: 1px; 
        right: 1px; 
        width: 12px; 
        height: 12px; 
        background: #94a3b8; 
        border: 2.5px solid white; 
        border-radius: 50%;
    }
    .status-online { 
        background: #10b981 !important; 
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .chat-scroll-area {
        flex-grow: 1;
        overflow-y: auto;
        padding: 28px;
        /* GORGEOUS MESH PASTEL GRADIENT IN CHAT */
        background: radial-gradient(circle at 85% 15%, rgba(59, 130, 246, 0.06) 0%, transparent 45%),
                    radial-gradient(circle at 15% 85%, rgba(139, 92, 246, 0.06) 0%, transparent 45%),
                    rgba(255, 255, 255, 0.2);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .msg-bubble-modern {
        padding: 12px 18px;
        font-size: 0.95rem;
        max-width: 65%;
        border-radius: 18px;
        line-height: 1.5;
        position: relative;
        margin-bottom: 14px;
        box-shadow: 0 4px 15px rgba(15, 23, 42, 0.015);
        transition: transform 0.2s ease;
    }
    .msg-bubble-modern:hover {
        transform: scale(1.01);
    }
    .msg-sent-modern {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: #ffffff;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
    }
    .msg-received-modern {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #0f172a;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .msg-time-modern { 
        font-size: 0.65rem; 
        margin-top: 5px; 
        opacity: 0.7; 
        text-align: right; 
    }
    .msg-sent-modern .msg-time-modern {
        color: rgba(255, 255, 255, 0.85);
    }

    .chat-footer {
        padding: 16px 28px 24px 28px;
        background: transparent;
        border-top: none;
    }
    
    .modern-input-group {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modern-input-group:focus-within {
        border-color: rgba(59, 130, 246, 0.5);
        background: #ffffff;
        box-shadow: 0 12px 30px rgba(59, 130, 246, 0.12), 0 0 0 4px rgba(59, 130, 246, 0.08);
        transform: translateY(-2px);
    }
    .modern-input-group input {
        border: none;
        background: transparent;
        padding: 10px;
        flex-grow: 1;
        outline: none;
        color: #0f172a;
        font-size: 0.95rem;
    }
    .modern-send-btn {
        background: #3b82f6;
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        flex-shrink: 0;
    }
    .modern-send-btn:hover {
        background: #2563eb;
        transform: translateY(-1px) scale(1.04);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    
    .chat-empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #64748b;
        background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);
    }
    .chat-empty-state i {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 10px rgba(59, 130, 246, 0.15));
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

    /* Typing Animation */
    .typing-indicator {
        background-color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(226, 232, 240, 0.8);
        padding: 10px 16px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        margin-bottom: 10px;
        align-self: flex-start;
        font-size: 0.8rem;
        color: #64748b;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
    }
    .typing-indicator span {
        height: 6px;
        width: 6px;
        float: left;
        margin: 0 2px;
        background-color: #3b82f6;
        display: block;
        border-radius: 50%;
        opacity: 0.4;
    }
    .typing-indicator span:nth-of-type(1) { animation: 1s blink infinite 0.3333s; }
    .typing-indicator span:nth-of-type(2) { animation: 1s blink infinite 0.6666s; }
    .typing-indicator span:nth-of-type(3) { animation: 1s blink infinite 0.9999s; }
    @keyframes blink { 50% { opacity: 1; } }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .messages-container {
            height: calc(100vh - 70px);
            margin-top: 0;
            border-radius: 0;
            border: none;
        }
        .inbox-panel {
            display: flex;
            width: 100%;
        }
        .chat-panel {
            display: none;
            width: 100%;
        }
        .messages-container.chat-open .inbox-panel {
            display: none;
        }
        .messages-container.chat-open .chat-panel {
            display: flex;
        }
        .back-to-inbox {
            display: flex !important;
        }
    }
    .back-to-inbox {
        display: none;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #f1f5f9;
        color: #475569;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .back-to-inbox:hover {
        background: #e2e8f0;
    }
</style>
{% endblock head %}

{% block body %}
<div class="container-fluid">
    <div class="row messages-container g-0">
        <div class="col-md-4 col-lg-3 inbox-panel">
            <div class="panel-header shadow-sm">
                <h5 class="m-0 fw-bold"><i class="fas fa-comment-dots text-primary me-2"></i>Mesajlar</h5>
            </div>
            <div class="chat-scroll-area p-0" id="inbox-list">
                <div class="text-center p-5 opacity-50">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>

        <div class="col-md-8 col-lg-9 chat-panel">
            <div class="panel-header shadow-sm z-1" id="chat-header" style="display: none;">
                <div class="d-flex align-items-center gap-3">
                    <div id="back-to-inbox" class="back-to-inbox me-1">
                        <i class="fas fa-arrow-left"></i>
                    </div>
                    <a href="#" id="chat-target-profile-link" class="text-decoration-none text-dark d-flex align-items-center gap-3">
                        <div class="position-relative">
                            <div class="avatar-placeholder-circle" style="width: 48px; height: 48px;">
                                <img id="chat-user-avatar" src="" class="rounded-circle" style="width: 100%; height: 100%; object-fit: cover; display: none;" onerror="this.style.display='none'; document.getElementById('chat-user-initials').style.display='flex';">
                                <span id="chat-user-initials"></span>
                            </div>
                            <span id="chat-user-status-dot" class="status-dot-modern"></span>
                        </div>
                        <div>
                            <div class="d-flex align-items-center gap-2">
                                <h6 class="m-0 fw-bold" id="chat-target-name">Kullanıcı</h6>
                                <span id="chat-target-rank" class="badge" style="font-size: 0.65rem; padding: 0.25em 0.5em; border-radius: 4px; color: white;"></span>
                            </div>
                            <small id="chat-target-status" class="text-muted">Son görülme: ...</small>
                        </div>
                    </a>
                </div>
            </div>

            <div id="chat-empty-state" class="chat-empty-state">
                <i class="far fa-comments fa-4x mb-3 opacity-50"></i>
                <h5>Sohbet başlatmak için bir kişi seçin</h5>
                <p class="small">Sol taraftaki listeden bir konuşmaya tıklayın.</p>
            </div>

            <!-- Mesajların listelendiği asıl alan -->
            <div class="chat-scroll-area" id="chat-messages" style="display: none !important;">
                <div id="messages-wrapper" style="display: flex; flex-direction: column;"></div>
                <div id="typing-indicator-wrapper" style="display: none;">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                        <em class="ms-2">yazıyor...</em>
                    </div>
                </div>
            </div>

            <div class="chat-footer z-1" id="chat-footer" style="display: none;">
                <form id="chat-form">
                    <input type="hidden" id="chat-receiver-id">
                    <div class="modern-input-group">
                        <input type="text" id="chat-input" name="body" autocomplete="off" placeholder="Mesajınızı buraya yazın..." required>
                        <button type="submit" class="modern-send-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock body %}

{% block js %}
<script>
// Bildirim sesi - Daha profesyonel bir "ding"
const notificationSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3");
notificationSound.volume = 0.4;

$(document).ready(function() {
    let activeUserId = null;
    let chatInterval = null;
    const currentUserId = parseInt("{{ request.user.id }}");
    
    let chatSocket;
    let reconnectAttempts = 0;
    const maxAttempts = 5;

    // WebSocket Bağlantısı (Exponential Backoff ile)
    function connectWebSocket() {
        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = wsScheme + "://" + window.location.host + "/ws/chat/";
        
        console.log("WebSocket bağlantısı başlatılıyor...");
        chatSocket = new WebSocket(wsUrl);

        chatSocket.onopen = function() {
            console.log("WebSocket bağlandı!");
            reconnectAttempts = 0;
            // Bağlantı açıldığında bir kez verileri tazele
            if (activeUserId) loadChatHistory(activeUserId, false);
            loadInbox();
        };

        chatSocket.onmessage = function(e) {
            try {
                const data = JSON.parse(e.data);
                if (data.type === 'typing_status' && parseInt(data.sender_id) === parseInt(activeUserId)) {
                    if (data.is_typing) {
                        $("#typing-indicator-wrapper").show();
                        scrollToBottom(); // Yazıyor efekti gelince aşağı kaydır
                    } else {
                        $("#typing-indicator-wrapper").hide();
                    }
                } else if (data.type === 'new_message') {
                    if (parseInt(data.sender_id) !== currentUserId) {
                        notificationSound.play().catch(e => {});
                    }
                    loadInbox();
                    if (parseInt(data.sender_id) === parseInt(activeUserId)) {
                        loadChatHistory(activeUserId, true);
                    }
                }
            } catch (err) {
                console.error("Mesaj ayrıştırma hatası:", err);
            }
        };

        chatSocket.onclose = function(e) {
            if (reconnectAttempts < maxAttempts) {
                reconnectAttempts++;
                const delay = Math.min(10000, 1000 * reconnectAttempts); // Kademeli bekleme
                console.warn(`Bağlantı kapandı. ${delay/1000}s içinde tekrar denenecek (${reconnectAttempts}/${maxAttempts})`);
                setTimeout(connectWebSocket, delay);
            } else {
                console.error("Maksimum bağlantı denemesine ulaşıldı.");
            }
        };

        chatSocket.onerror = function(err) {
            console.error("WebSocket hatası:", err);
            chatSocket.close();
        };
    }

    connectWebSocket();

    // Auto-Scroll Fonksiyonu
    function scrollToBottom(force = false) {
        const chatArea = document.getElementById("chat-messages");
        if (chatArea) {
            // Küçük bir gecikme DOM render süresi için gereklidir
            setTimeout(() => {
                chatArea.scrollTo({
                    top: chatArea.scrollHeight,
                    behavior: force ? 'auto' : 'smooth'
                });
            }, 100);
        }
    }

    function getInitials(name) {
        if (!name) return "??";
        let parts = name.trim().split(" ");
        let initials = parts[0].charAt(0);
        if (parts.length > 1) initials += parts[parts.length - 1].charAt(0);
        return initials.toUpperCase();
    }

    // Inbox Listesini Yükle (AJAX)
    function loadInbox() {
        $.ajax({
            url: "{% url 'user:inbox' %}",
            headers: { "X-Requested-With": "XMLHttpRequest" },
            success: function(data) {
                let html = "";
                if (data.conversations && data.conversations.length > 0) {
                    data.conversations.forEach(function(c) {
                        let badge = c.unread > 0 ? `<span class="badge bg-primary rounded-pill">${c.unread}</span>` : "";
                        let isActive = parseInt(activeUserId) === parseInt(c.user_id) ? "active" : "";
                        let showAvatar = (c.avatar && c.avatar.indexOf("default") === -1);
                        
                        html += `
                        <div class="inbox-item p-3 d-flex align-items-center gap-3 ${isActive}" data-user-id="${c.user_id}" data-username="${c.username}">
                            <div class="position-relative">
                                <div class="avatar-placeholder-circle shadow-sm" style="width: 45px; height: 45px;">
                                    ${showAvatar ? `<img src="${c.avatar}" class="rounded-circle" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
                                    <span class="initials-text" style="${showAvatar ? 'display:none;' : ''}">${getInitials(c.username)}</span>
                                </div>
                                ${c.is_online ? '<span class="status-dot-modern status-online"></span>' : ''}
                            </div>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="fw-bold text-dark">${c.username}</span>
                                    <span class="text-muted" style="font-size: 0.7rem;">${c.time}</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="text-truncate text-muted" style="font-size: 0.8rem; max-width: 80%;">${c.last_msg}</span>
                                    ${badge}
                                </div>
                            </div>
                        </div>`;
                    });
                } else { 
                    html = '<div class="text-center p-5 text-muted small mt-4">Henüz mesajınız yok.</div>'; 
                }
                $("#inbox-list").html(html);
            }
        });
    }

    // Chat Geçmişini Yükle (AJAX)
    function loadChatHistory(userId, shouldScroll = false) {
        if (!userId) return;
        $.ajax({
            url: "/user/chat/" + userId + "/",
            type: "GET",
            headers: { "X-Requested-With": "XMLHttpRequest" },
            success: function(data) {
                let msgHtml = "";
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(function(m) {
                        let alignmentClass = m.is_me ? "msg-sent-modern" : "msg-received-modern";
                        msgHtml += `
                        <div class="msg-bubble-modern ${alignmentClass}">
                            <div style="word-break: break-word;">${m.body}</div>
                            <div class="msg-time-modern">${m.time} ${m.is_me && m.is_read ? '<i class="fas fa-check-double ms-1 text-white-50"></i>' : (m.is_me ? '<i class="fas fa-check ms-1 text-white-50"></i>' : '')}</div>
                        </div>`;
                    });
                } else { 
                    msgHtml = `<div class="text-center p-4 text-muted small mt-auto mb-auto">İlk mesajı siz gönderin...</div>`; 
                }
                
                // Wrapper'ı güncelle ki typing indicator kaybolmasın
                $("#messages-wrapper").html(msgHtml);
                
                // Başlık bilgilerini güncelle
                if (data.other_user) {
                    $("#chat-target-name").text(data.other_user.username);
                    $("#chat-target-status").text("Son görülme: " + data.other_user.last_seen);
                    
                    // Durum noktasını ve metnini güncelle
                    if (data.other_user.is_online) {
                        $("#chat-user-status-dot").addClass("status-online");
                        $("#chat-target-status").text("Çevrimiçi").addClass("text-success").removeClass("text-muted");
                    } else {
                        $("#chat-user-status-dot").removeClass("status-online");
                        $("#chat-target-status").text("Son görülme: " + data.other_user.last_seen).addClass("text-muted").removeClass("text-success");
                    }

                    // Profil linkini güncelle
                    $("#chat-target-profile-link").attr("href", `/user/profile/${data.other_user.username}/`);

                    // Rank rozetini güncelle
                    if (data.other_user.rank_title) {
                        $("#chat-target-rank").text(data.other_user.rank_title)
                                            .css("background-color", data.other_user.rank_color)
                                            .show();
                    } else {
                        $("#chat-target-rank").hide();
                    }

                    let hasAvatar = data.other_user.avatar && data.other_user.avatar.indexOf("default") === -1;
                    if(hasAvatar) {
                        $("#chat-user-avatar").attr("src", data.other_user.avatar).show();
                        $("#chat-user-initials").hide();
                    } else {
                        $("#chat-user-avatar").hide();
                        $("#chat-user-initials").text(getInitials(data.other_user.username)).show();
                    }
                }
                
                if (shouldScroll) { scrollToBottom(); }
            }
        });
    }

    // Kişi Seçme
    $(document).on("click", ".inbox-item", function() {
        const userId = $(this).attr("data-user-id");
        if (parseInt(userId) === currentUserId) return;
        
        $(".inbox-item").removeClass("active");
        $(this).addClass("active");
        
        activeUserId = userId;
        $("#chat-receiver-id").val(userId);
        $("#chat-empty-state").hide();
        $("#chat-header").attr("style", "display: flex !important;");
        $("#chat-messages").attr("style", "display: flex !important;");
        $("#chat-footer").show();
        $(".messages-container").addClass("chat-open");
        
        // İlk yüklemede aşağı kaydır
        loadChatHistory(userId, true);
        
        if (chatInterval) clearInterval(chatInterval);
        // Polling: Sadece WebSocket bağlı değilse yedek olarak çalışır
        chatInterval = setInterval(function() { 
            if (chatSocket && chatSocket.readyState !== WebSocket.OPEN) {
                loadChatHistory(activeUserId, false); 
                loadInbox(); 
            }
        }, 15000);
    });

    // Typing Feedback Logic (Debounce 1.5s)
    let typingDebounceTimer;
    let isCurrentlyTyping = false;

    $("#chat-input").on("input", function() {
        if (!activeUserId) return;
        
        if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
            if (!isCurrentlyTyping) {
                isCurrentlyTyping = true;
                chatSocket.send(JSON.stringify({ 
                    'type': 'typing_status', 
                    'is_typing': true, 
                    'receiver_id': activeUserId 
                }));
            }
            
            clearTimeout(typingDebounceTimer);
            typingDebounceTimer = setTimeout(() => {
                isCurrentlyTyping = false;
                if (chatSocket.readyState === WebSocket.OPEN) {
                    chatSocket.send(JSON.stringify({ 
                        'type': 'typing_status', 
                        'is_typing': false, 
                        'receiver_id': activeUserId 
                    }));
                }
            }, 1500);
        }
    });

    // Mesaj Gönderme
    $("#chat-form").on("submit", function(e) {
        e.preventDefault();
        const userId = $("#chat-receiver-id").val();
        const messageInput = $("#chat-input");
        const messageText = messageInput.val().trim();
        if (!messageText || !userId) return;
        
        $.ajax({
            url: "/user/chat/" + userId + "/",
            type: "POST",
            data: { "body": messageText, "csrfmiddlewaretoken": "{{ csrf_token }}" },
            success: function() {
                messageInput.val("");
                loadChatHistory(userId, true);
                loadInbox();
                
                // Yazıyor durumunu hemen temizle
                clearTimeout(typingDebounceTimer);
                isCurrentlyTyping = false;
                if (chatSocket.readyState === WebSocket.OPEN) {
                    chatSocket.send(JSON.stringify({ 
                        'type': 'typing_status', 
                        'is_typing': false, 
                        'receiver_id': userId 
                    }));
                }
            }
        });
    });

    // Geri butonu (Mobil için)
    $(document).on("click", "#back-to-inbox", function() {
        $(".messages-container").removeClass("chat-open");
    });

    loadInbox();

    // Eğer URL'den bir user_id gelmişse onu otomatik seç
    const targetUserId = "{{ target_user.id|default:'' }}";
    if (targetUserId && parseInt(targetUserId) !== currentUserId) {
        setTimeout(() => {
            const existingItem = $(`.inbox-item[data-user-id="${targetUserId}"]`);
            if (existingItem.length > 0) {
                existingItem.click();
            } else {
                // Listede olmayan YENİ bir kullanıcıya mesaj atılıyorsa
                activeUserId = targetUserId;
                $("#chat-receiver-id").val(targetUserId);
                $("#chat-empty-state").hide();
                $("#chat-header").attr("style", "display: flex !important;");
                $("#chat-messages").attr("style", "display: flex !important;");
                $("#chat-footer").show();
                $(".messages-container").addClass("chat-open");
                loadChatHistory(targetUserId, true);
            }
        }, 800); // Inbox'ın yüklenmesi için biraz daha süre tanıyalım
    }
});
</script>
{% endblock js %}
